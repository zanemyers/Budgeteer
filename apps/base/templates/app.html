<!DOCTYPE html>
{% load vite %}

<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/public/static/favicon.ico">
    <title>{{ SITE_NAME }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Mono:wght@400;500&display=swap"
          rel="stylesheet">
    <script>
      (function () {
        var t = localStorage.getItem("theme") || "auto";
        var e = t === "auto" ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
        if (e === "dark") document.documentElement.classList.add("dark");
      })();
    </script>
    {% vite_asset 'css/main.css' %}
    {% include "blocks/google-analytics.html" %}
  </head>
  <body class="h-full">
    {% block inertia %}{% endblock %}
    {% vite_react_refresh %}
    {% vite_hmr_client %}
    {% vite_asset 'tsx/main.tsx' %}
  </body>
</html>
